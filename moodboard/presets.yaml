version: 1

defaults:
  output_format: webp
  output_quality: 90

placement_to_preset:
  cover: blog-cover-visual

brief_type_to_preset:
  cover: blog-cover-visual

presets:

  # Covers de blog jonlabs = skill `visual` (gpt-image-2), depuis la migration du 2026-07-19.
  # PAS l'ancien pipeline template/texte-overlay (bg-template.png supprimé, cf. commit 33bb825).
  # `source: visual` n'est PAS exécuté par generate-images/cli.py : il route vers le skill `visual`
  # (moteur render.py autonome, marque embarquée). generate-cover DOIT s'arrêter et déléguer à /visual.
  blog-cover-visual:
    description: "Cover illustrée semi-concrète via skill `visual` (gpt-image-2, 16:9, sans texte, sans logo)"
    source: visual
    skill: visual                       # ← moteur : ~/.claude/skills/visual (render.py)
    typologie: illustration
    niveau: semi-concret                 # ancre concrète + statue N&B en signature (cf. moodboard §15b)
    refs: "illustration/illu2-statue-laptop.png,illustration/illu6-phone-collage.png"
    size: 1536x1024                      # natif 3:2
    target: 16x9                         # center-crop → cover plein-cadre (jamais de padding warm)
    logo: none                           # direction illustration = jamais de logo
    quality: medium
    output_dir: public/images/blog
    output_naming: "{slug}.webp"

  linkedin-cover-gemini:
    description: "Cover LinkedIn cartoon/absurde via Gemini, format carré 1:1, aucun overlay texte"
    source: gemini
    base_style_override: flat-illustration
    no_reference: true
    layout_directives: "Generate a square 1:1 cartoon illustration, 1280x1280px, centered composition suitable for a LinkedIn feed post."
    compose_text: false
    output_dir: public/images/linkedin
    output_naming: "{slug}.webp"

  gmb-post-gemini-scene:
    description: "Photo GMB 4:3 1200x900 via Gemini — scène clean (objet/lieu/lifestyle), aucun texte sur l'image, aucune référence"
    source: gemini
    no_reference: true
    layout_directives: "Generate a landscape 4:3 photo, 1200x900 pixels, image must be wider than tall. Photorealistic DSLR style, no text anywhere in the image."
    compose_text: false
    output_dir: content/gmb/images/jonlabs
    output_naming: "{slug}.png"

  gmb-post-template:
    description: "Image GMB 1200x900 (4:3) — template Jon Labs avec bande noire centrale, titre noir au-dessus, sous-titre lavande dans la bande. Tout config local au projet (couleurs/sizes/positions). Mode dual-text — lu par compose_dual_text_overlay."
    source: template
    template_image: moodboard/refs/gmb-bg.png
    compose_text: true
    font_file: fonts/InterTight-VariableFont_wght.ttf
    dimensions: "1200x900"
    # Recommandations longueur (le composer wrap/shrink auto, mais pour briefing humain) :
    # title    : 12-22 caractères (1 ligne, gros) — idéal "Optimiser sa GMB"
    # subtitle : 30-50 caractères (2 lignes max), 4-7 mots
    title_overlay:
      text_color: "#1a1a1a"
      font_size_ratio: 0.10        # 120px sur 1200 de large
      font_weight: 700
      tracking: -0.02
      max_width_ratio: 0.92        # auto-shrink si dépasse 92% de la largeur
      auto_shrink: true
      align: center
      anchor: above_band           # ancre au-dessus de la bande noire pré-existante
      band_top_ratio: 0.5167       # haut de bande à y=465 sur 900
      gap_to_band: 58              # 58px entre bas du titre et haut de bande
      v_offset: 0
    subtitle_overlay:
      text_color: "#00D9A3"        # vert/turquoise brand Jon Labs
      font_size_ratio: 0.060       # 72px sur 1200
      font_weight: 700
      tracking: -0.01
      max_width_ratio: 0.78        # 78% pour wrap propre sur 2 lignes
      line_spacing: 1.1
      align: center
      anchor: band_center          # centré dans la bande noire
      band_top_ratio: 0.5167       # haut de bande
      band_bot_ratio: 0.7767       # bas de bande à y=699 sur 900
      v_offset: -4                 # léger nudge vers le haut pour balance optique
    output_dir: static/gmb-assets
    output_naming: "post-{index:02d}.png"
